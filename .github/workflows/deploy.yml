name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 开启 Pages 需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署任务，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建站点
        run: npm run build
        env:
          # 站点挂在仓库子路径下，所有资源路径与路由前缀都要带上它
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
