[project]
name = "campus-platform-backend"
version = "0.1.0"
description = "校园学习资源共享与知识协作平台 · 后端服务"
requires-python = ">=3.11"

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # 数据校验
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # ORM 与 MySQL 驱动
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    # 迁移
    "alembic>=1.14.0",
    # 认证
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    # 文件与数据
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    # 工具
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
